services:
  - type: web
    name: mutseri-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false   # Set this manually in the Render dashboard
      - key: DISCORD_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
